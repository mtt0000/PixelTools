name: Build and Release Minimal

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Grant execute permission for build_minimal.sh
      run: chmod +x build_minimal.sh

    - name: Extract Branch and Commit
      id: extract_info
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BRANCH_NAME="${{ github.head_ref }}"
        else
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        fi

        # Replace slashes with dashes to avoid path issues
        SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
        echo "BRANCH_NAME=$SAFE_BRANCH_NAME" >> $GITHUB_ENV

    - name: Run build script
      run: ./build_minimal.sh

    - name: Rename artifacts
      run: |
        mv PixelXpert-Minimal.apk "PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.apk"
        mv PixelXpert-Minimal.zip "PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.zip"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}-APK
        path: PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.apk

    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}-ZIP
        path: PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.apk
          PixelXpert-Minimal-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.zip
        name: "Build ${{ env.BRANCH_NAME }} - ${{ env.SHORT_SHA }}"
        tag_name: "build-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
